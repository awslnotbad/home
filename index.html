<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Home-夏末の随风</title>
    <link href="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" rel="icon" sizes="32x32"/>
    <link href="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" rel="icon" sizes="192x192"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <style>
        :root {
            --primary: #a855f7;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --text: #f8fafc;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(168, 85, 247, 0.3);
            --shadow: rgba(168, 85, 247, 0.2);
            --bg: #0f172a;
            --particle-color: rgba(168, 85, 247, 0.6);
            --line-color: rgba(168, 85, 247, 0.15);
            --glow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        [data-theme="light"] {
            --primary: #ec4899;
            --secondary: #a855f7;
            --accent: #06b6d4;
            --text: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(236, 72, 153, 0.3);
            --shadow: rgba(236, 72, 153, 0.15);
            --bg: #fdf2f8;
            --particle-color: rgba(236, 72, 153, 0.5);
            --line-color: rgba(236, 72, 153, 0.1);
            --glow: 0 0 20px rgba(236, 72, 153, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.6s ease, color 0.6s ease;
        }

        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        .theme-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: var(--text); font-size: 1.2em;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            box-shadow: var(--glow);
            cursor: pointer;
            /* 安全兜底：即使JS失效，CSS伪元素也能显示图标 */
        }
        .theme-toggle::before { content: '🌙'; }
        [data-theme="light"] .theme-toggle::before { content: '☀️'; }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(20deg);
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent);
        }

        main {
            position: relative; z-index: 1; height: 100%;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }

        .card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid var(--glass-border);
            padding: 50px 40px; max-width: 420px; width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px var(--shadow), var(--glow);
            animation: cardEnter 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: translateY(30px);
            transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
        }

        @keyframes cardEnter { to { opacity: 1; transform: translateY(0); } }

        .avatar {
            width: 110px; height: 110px; border-radius: 50%;
            border: 3px solid var(--text); margin: 0 auto 20px;
            box-shadow: var(--glow);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; z-index: 2;
        }
        .avatar:hover {
            transform: scale(1.1) rotate(10deg);
            border-color: var(--accent);
            box-shadow: 0 0 40px var(--accent);
        }

        .title {
            font-size: 1.6em; font-weight: 600;
            margin-bottom: 8px; color: var(--secondary);
            letter-spacing: 1px; position: relative; z-index: 2;
        }

        .subtitle {
            font-size: 0.9em; opacity: 0.7;
            margin-bottom: 35px; color: var(--text);
            position: relative; z-index: 2;
        }

        .links {
            display: flex; flex-direction: column; gap: 12px;
            position: relative; z-index: 2;
        }

        .link-btn {
            position: relative; display: flex; align-items: center;
            justify-content: center; gap: 10px;
            padding: 16px 24px; color: var(--text);
            text-decoration: none; border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            font-weight: 500; font-size: 0.95em;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(20px);
        }
        .link-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }
        .link-btn:hover::before { left: 100%; }
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text);
            transform: translateZ(30px) scale(1.03);
            box-shadow: 0 8px 25px var(--shadow);
        }
        .link-btn:active { transform: translateZ(20px) scale(0.98); }
        .link-btn .icon { font-size: 1.2em; }

        footer {
            position: fixed; bottom: 24px; left: 0; right: 0;
            text-align: center; font-size: 0.8em; opacity: 0.6;
            z-index: 1; color: var(--text); transition: opacity 0.3s;
        }
        footer:hover { opacity: 0.8; }
        footer a {
            color: var(--secondary); text-decoration: none;
            border-bottom: 1px dashed var(--secondary);
            transition: all 0.3s;
        }
        footer a:hover { color: var(--accent); border-color: var(--accent); }

        @media (max-width: 480px) {
            .theme-toggle { top: 15px; right: 15px; width: 38px; height: 38px; font-size: 1em; }
            .card { padding: 35px 25px; }
            .avatar { width: 90px; height: 90px; }
            .title { font-size: 1.4em; }
            .link-btn { padding: 14px 20px; font-size: 0.9em; }
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 10001;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader {
            width: 40px; height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loader"><div class="loader"></div></div>

    <button class="theme-toggle" id="themeToggle" title="切换主题"></button>

    <canvas id="particles"></canvas>

    <main>
        <div class="card">
            <div class="logo">
                <img class="avatar" src="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" title="夏末随风的个人首页" alt="Avatar" loading="lazy"/>
            </div>
            <h1 class="title">夏末の随风</h1>
            <p class="subtitle">记录生活</p>
            <div class="links">
                <a href="https://awslnotbad.cn/" target="_blank" class="link-btn"><span class="icon">✨</span> 我的博客</a>
                <a href="https://yun.awslnotbad.cn" target="_blank" class="link-btn"><span class="icon">☁️</span> 个人云盘</a>
                <a href="https://space.bilibili.com/336650235" target="_blank" class="link-btn"><span class="icon">📺</span> Bilibili空间</a>
                <a href="https://steamcommunity.com/profiles/76561198882696951/" target="_blank" class="link-btn"><span class="icon">🎮</span> Steam主页</a>
                <a href="https://whenlv6.awslnotbad.cn/" target="_blank" class="link-btn"><span class="icon">🚀</span> B站等级计算器</a>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2020-2026 By <a href="https://awslnotbad.cn/" target="_blank">夏末随风</a>.</p>
    </footer>

    <script>
        // ===== 主题切换（修复版）=====
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');

        // 初始化主题
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
        }

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            // 切换主题后重新初始化粒子，确保颜色同步
            initParticles();
        });

        // ===== 加载遮罩 =====
        let loaderHidden = false;
        function hideLoader() {
            if (loaderHidden) return;
            loaderHidden = true;
            const loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(() => { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 400);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', hideLoader);
        } else {
            hideLoader();
        }
        const avatar = document.querySelector('.avatar');
        if (avatar && avatar.complete) {
            hideLoader();
        } else if (avatar) {
            avatar.addEventListener('load', hideLoader);
            avatar.addEventListener('error', hideLoader);
        }

        // ===== 粒子网络背景（性能优化版）=====
        const canvas = document.getElementById('particles');
        const ctx = canvas && canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };
        let animationId;

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            if (!canvas) return;
            particles = [];
            const isMobile = window.innerWidth < 768;
            const count = isMobile ? 30 : Math.min(Math.floor((canvas.width * canvas.height) / 15000), 80);
            for (let i = 0; i < count; i++) { particles.push(new Particle()); }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
            }
            update() {
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        this.x -= forceDirectionX * force * this.density * 0.5;
                        this.y -= forceDirectionY * force * this.density * 0.5;
                    } else {
                        if (this.x !== this.baseX) { let dx = this.x - this.baseX; this.x -= dx / 20; }
                        if (this.y !== this.baseY) { let dy = this.y - this.baseY; this.y -= dy / 20; }
                    }
                }
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                if (!ctx) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--particle-color').trim();
                ctx.fill();
            }
        }

        function connectParticles() {
            if (!ctx || !canvas) return;
            const lineColor = getComputedStyle(document.documentElement).getPropertyValue('--line-color').trim();
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            if (!ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connectParticles();
            animationId = requestAnimationFrame(animateParticles);
        }

        document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        document.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', resizeCanvas);

        // 初始化
        resizeCanvas();
        animateParticles();
    </script>
</body>
</html>
