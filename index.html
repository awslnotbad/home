<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Home-夏末の随风</title>
    <link href="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" rel="icon" sizes="32x32"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #ff0055;
            --accent: #bd00ff;
            --text: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg-gradient: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
            --glow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        [data-theme="light"] {
            --primary: #ff0055;
            --secondary: #bd00ff;
            --text: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --bg-gradient: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #84fab0, #8fd3f4);
            --glow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: var(--text);
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--glow);
        }
        .theme-toggle:hover { transform: rotate(180deg) scale(1.1); }

        main {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* 3D 视差关键 */
        }

        .card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), var(--glow);
            transform-style: preserve-3d; /* 3D 视差关键 */
            transition: transform 0.1s ease; /* 平滑移动 */
        }

        .avatar {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin: 0 auto 20px;
            box-shadow: var(--glow);
            transition: all 0.5s ease;
            position: relative;
            z-index: 2;
        }
        .avatar:hover {
            transform: scale(1.1) rotate(360deg);
            border-color: var(--secondary);
            box-shadow: 0 0 30px var(--secondary);
        }

        .title {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            font-family: 'Courier New', monospace;
            font-size: 1em;
            color: var(--text);
            margin-bottom: 35px;
            height: 1.2em; /* 固定高度防止抖动 */
            position: relative;
            z-index: 2;
            border-right: 2px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
            display: inline-block;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--primary); } }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            color: var(--text);
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            font-weight: 500;
            overflow: hidden;
            transition: all 0.3s ease;
            transform: translateZ(20px);
        }

        /* 按钮流光效果 */
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }
        .link-btn:hover::before { left: 100%; }

        .link-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
            transform: translateZ(30px) scale(1.05);
            border-color: var(--primary);
        }

        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            opacity: 0.5;
            z-index: 1;
            color: var(--text);
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0f0c29;
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .loader {
            width: 50px; height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px var(--primary);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loader"><div class="loader"></div></div>
    <button class="theme-toggle" id="themeToggle">☀️</button>
    <canvas id="particles"></canvas>
    
    <main>
        <div class="card" id="tiltCard">
            <img class="avatar" src="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" alt="Avatar"/>
            <h1 class="title">夏末随风</h1>
            <p class="subtitle">Loading Life...</p>
            <div class="links">
                <a href="https://awslnotbad.cn/" target="_blank" class="link-btn"><span class="icon">✨</span> 日常博客</a>
                <a href="https://space.bilibili.com/336650235" target="_blank" class="link-btn"><span class="icon">📺</span> Bilibili空间</a>
                <a href="https://steamcommunity.com/profiles/76561198882696951/" target="_blank" class="link-btn"><span class="icon">🎮</span> Steam主页</a>
                <a href="https://yun.awslnotbad.cn" target="_blank" class="link-btn"><span class="icon">☁️</span> 个人云盘</a>
                <a href="https://whenlv6.awslnotbad.cn/" target="_blank" class="link-btn"><span class="icon">🚀</span> B站等级计算器</a>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2020-2026 By <a href="https://awslnotbad.cn/" style="color:var(--secondary)">夏末随风</a>.</p>
    </footer>

    <script>
        // ===== 主题切换 =====
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        themeToggle.addEventListener('click', () => {
            const isLight = html.getAttribute('data-theme') === 'light';
            html.setAttribute('data-theme', isLight ? 'dark' : 'light');
            initParticles(); // 切换主题重置粒子颜色
        });

        // ===== 3D 视差效果 =====
        const card = document.getElementById('tiltCard');
        const main = document.querySelector('main');

        main.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 38; // 旋转角度计算
            const yAxis = (window.innerHeight / 2 - e.pageY) / 38;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        main.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        main.addEventListener('mouseleave', () => {
            card.style.transition = 'all 0.5s ease';
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // ===== 加载遮罩 =====
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        });

        // ===== 粒子特效 (保持原有逻辑，优化颜色获取) =====
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            const count = window.innerWidth < 768 ? 30 : 60;
            for(let i=0; i<count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary');
            
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();

                // 连线
                for(let j=i+1; j<particles.length; j++) {
                    const dx = p.x - particles[j].x;
                    const dy = p.y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 100) {
                        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary');
                        ctx.globalAlpha = (100 - dist) / 100 * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
