<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Home-夏末の随风</title>
    <link href="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" rel="icon" sizes="32x32"/>
    <link href="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" rel="icon" sizes="192x192"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <style>
        :root {
            --primary: #ff69b4;
            --secondary: #d63384;
            --accent: #8e44ad;
            --text: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: rgba(255, 105, 180, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            color: var(--text);
        }

        /* 樱花飘落动画 */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sakura {
            position: absolute;
            top: -10%;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, #ffb7c5 0%, #ff69b4 100%);
            border-radius: 100% 0 100% 0;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        .sakura:nth-child(odd) {
            background: radial-gradient(circle, #ffc0cb 0%, #ff69b4 100%);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10%) rotate(0deg) translateX(0);
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) translateX(100px);
                opacity: 0;
            }
        }

        main {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px var(--shadow);
            animation: cardEnter 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 20px;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 8px 30px var(--shadow);
        }

        .title {
            font-size: 1.6em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 35px;
            color: var(--text);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            color: var(--text);
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            font-size: 0.95em;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .link-btn:hover::before {
            left: 100%;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px var(--shadow);
            border-color: var(--primary);
            color: var(--secondary);
        }

        .link-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .link-btn .icon {
            font-size: 1.2em;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8em;
            opacity: 0.6;
            z-index: 1;
            color: var(--text);
        }

        footer a {
            color: var(--secondary);
            text-decoration: none;
            border-bottom: 1px dashed var(--secondary);
            transition: all 0.3s;
        }

        footer a:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }
            .avatar {
                width: 90px;
                height: 90px;
            }
            .title {
                font-size: 1.4em;
            }
            .link-btn {
                padding: 14px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- 樱花飘落容器 -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <main>
        <div class="card">
            <div class="logo">
                <img class="avatar" src="https://pic.imgdb.cn/item/63835b9e16f2c2beb1049a47.gif" title="夏末随风的个人首页" alt="Avatar"/>
            </div>
            <h1 class="title">夏末の随风</h1>
            <p class="subtitle">记录生活 · 分享技术 · 探索未知</p>
            <div class="links">
                <a href="https://awslnotbad.cn/" target="_blank" class="link-btn">
                    <span class="icon">✨</span> 我的博客
                </a>
                <a href="https://yun.awslnotbad.cn" target="_blank" class="link-btn">
                    <span class="icon">☁️</span> 个人云盘
                </a>
                <a href="https://space.bilibili.com/336650235" target="_blank" class="link-btn">
                    <span class="icon">📺</span> Bilibili空间
                </a>
                <a href="https://steamcommunity.com/profiles/76561198882696951/" target="_blank" class="link-btn">
                    <span class="icon">🎮</span> Steam主页
                </a>
                <a href="https://whenlv6.awslnotbad.cn/" target="_blank" class="link-btn">
                    <span class="icon">🚀</span> B站等级计算器
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2020-2026 By <a href="https://awslnotbad.cn/" target="_blank">夏末随风</a>.</p>
    </footer>

    <script>
        // 生成樱花花瓣
        function createSakura() {
            const container = document.getElementById('sakuraContainer');
            const sakura = document.createElement('div');
            sakura.className = 'sakura';
            
            // 随机位置、大小、动画时长
            sakura.style.left = Math.random() * 100 + '%';
            sakura.style.width = sakura.style.height = (Math.random() * 10 + 10) + 'px';
            sakura.style.animationDuration = (Math.random() * 5 + 5) + 's';
            sakura.style.animationDelay = Math.random() * 5 + 's';
            
            container.appendChild(sakura);
            
            // 动画结束后移除
            setTimeout(() => {
                sakura.remove();
            }, 10000);
        }

        // 持续生成樱花
        setInterval(createSakura, 300);
        
        // 初始生成一些樱花
        for (let i = 0; i < 15; i++) {
            createSakura();
        }
    </script>
</body>
</html>
